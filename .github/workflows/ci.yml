name: Self test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: End-to-end self test (no network)
        env:
          ASSET_BASE: https://example.com/posts
        run: python scripts/selftest.py

  smoke:
    # Proves the live leaderboard contract still holds, without a full crawl.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probe the leaderboard API
        env:
          CF_YEAR: ${{ vars.CF_YEAR || '2026' }}
        run: python scripts/ingest.py --probe
      - name: Crawl three pages and render a post
        env:
          CF_YEAR: ${{ vars.CF_YEAR || '2026' }}
          ASSET_BASE: https://example.com/posts
          MIN_SAMPLE: "50"
        run: |
          python scripts/ingest.py --max-pages 3
          python scripts/run_weekly.py --dry-run --angle cutlines || \
            test $? -eq 2   # a tiny sample may not clear the gate; that is fine
