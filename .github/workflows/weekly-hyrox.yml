name: Weekly post (HYROX)

# The in-season post. HYROX races run most weekends from September, so this is
# the one that fires all season. Sunday 21:00 UTC = Monday 07:00 Melbourne.
#
# It runs off the split data committed in data/, so it needs no crawl and
# finishes in under a minute.
on:
  schedule:
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      angle:
        description: "Force an angle (sex-shape | where-won | run-fade). Blank = next in the bank."
        required: false
        default: ""
      dry_run:
        description: "Render but do not deliver"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: splitline-weekly-hyrox
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Write the post
        id: run
        env:
          ASSET_BASE: ${{ vars.ASSET_BASE }}
          SPLITLINE_PRODUCT_URL: ${{ vars.SPLITLINE_PRODUCT_URL }}
          HYROX_RACE: ${{ vars.HYROX_RACE || '2026 HYROX Beijing' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          set +e
          python scripts/run_hyrox.py \
            --men data/hyrox_beijing_men_raw.txt \
            --women data/hyrox_beijing_women_raw.txt \
            --race "$HYROX_RACE" \
            ${{ github.event.inputs.angle && format('--angle {0}', github.event.inputs.angle) || '' }} \
            ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          # 2 means nothing cleared the editorial gate — a quiet week, not a fault.
          if [ $code -eq 2 ]; then exit 0; fi
          exit $code

      - name: Commit the post and its charts
        if: steps.run.outputs.exit_code == '0'
        run: |
          git config user.name  "splitline-bot"
          git config user.email "splitline-bot@users.noreply.github.com"
          git add posts state
          if git diff --staged --quiet; then
            echo "nothing to commit"
          else
            git commit -m "post: $(date -u +%Y-%m-%d) HYROX weekly"
            git push
          fi

      - name: Upload the post
        if: steps.run.outputs.exit_code == '0'
        uses: actions/upload-artifact@v5
        with:
          name: splitline-hyrox-post-${{ github.run_number }}
          path: posts/
          retention-days: 90

      - name: Flag a quiet week
        if: steps.run.outputs.exit_code == '2'
        run: echo "::warning::No HYROX angle cleared the publish gate this week."
